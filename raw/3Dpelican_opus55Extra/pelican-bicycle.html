<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pelican on a Bicycle</title>
<style>
  :root {
    --panel-bg: rgba(16, 28, 40, 0.5);
    --panel-border: rgba(255, 255, 255, 0.18);
    --text: #f5f8fc;
    --muted: rgba(245, 248, 252, 0.74);
    --accent: #ffb547;
    --accent-ink: #2b1a00;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #d4e9f4; color: var(--text);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; touch-action: none; outline: none; }
  .panel {
    position: fixed;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    backdrop-filter: blur(10px) saturate(1.2);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16);
  }
  #title { top: 16px; left: 16px; padding: 11px 16px 12px; max-width: calc(100% - 32px); }
  #title h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: 0.2px; }
  #title p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  #controls {
    left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
    padding: 8px; max-width: calc(100% - 32px);
  }
  button {
    font: inherit; font-size: 13px; color: var(--text);
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 9px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: rgba(255, 255, 255, 0.2); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #pauseBtn { min-width: 84px; }
  .seg { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.2); border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: transparent; }
  .seg button:hover { background: rgba(255, 255, 255, 0.14); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .speed { display: flex; align-items: center; gap: 8px; padding: 0 6px; font-size: 13px; color: var(--muted); }
  .speed input { width: 110px; accent-color: var(--accent); }
  .speed output { min-width: 34px; color: var(--text); font-variant-numeric: tabular-nums; }
  #fallback {
    display: none; position: fixed; inset: 0; place-items: center; text-align: center;
    padding: 24px; color: #1d2a36; font-size: 15px;
  }
  @media (max-width: 560px) {
    #title p { display: none; }
    .speed input { width: 80px; }
    #controls { bottom: 10px; gap: 6px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title" class="panel">
  <h1>Pelican on a Bicycle</h1>
  <p>Drag to orbit · Scroll to zoom · Space to pause · C to change camera</p>
</div>

<div id="controls" class="panel">
  <button id="pauseBtn" type="button" aria-pressed="false">❚❚ Pause</button>
  <div class="seg" role="group" aria-label="Camera">
    <button type="button" data-cam="cinematic" aria-pressed="true">Cinematic</button>
    <button type="button" data-cam="chase" aria-pressed="false">Chase</button>
    <button type="button" data-cam="wide" aria-pressed="false">Wide</button>
  </div>
  <label class="speed">Speed
    <input id="speed" type="range" min="0.2" max="2.2" step="0.1" value="1" />
    <output id="speedVal">1.0×</output>
  </label>
</div>

<div id="fallback">
  <div>
    <strong>The 3D scene couldn't load.</strong><br />
    It needs an internet connection to fetch Three.js from cdn.jsdelivr.net, and a browser with WebGL.
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

window.__pelicanStarted = true;

/* ════════════════════════════ helpers ════════════════════════════ */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const rand = mulberry32(20261110);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const _t1 = V(), _t2 = V(), _t3 = V();

function canvasTexture(w, h, draw, rx = 1, ry = 1) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(rx, ry);
  tex.anisotropy = 8;
  return tex;
}

/** Solid cylinder from point a (radius rA) to point b (radius rB). */
function cylinderBetween(a, b, rA, rB, mat, radial = 12) {
  const dir = V().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rB, rA, len, radial), mat);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());

  const q = new THREE.Quaternion().setFromUnitVectors(UP, dir.clone().normalize());

  return geo;
}
function tubeThrough(points, r, mat, segs = 40, radial = 8) {

  return new THREE.Mesh(new THREE.TubeGeometry(curve, segs, r, radial, false), mat);
}
/** Stretch a unit-height (y) mesh so it spans a → b. */
function placeBetween(mesh, a, b) {

  const len = _t1.length() || 1e-4;
  mesh.position.copy(a).addScaledVector(_t1, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, _t1.divideScalar(len));
  mesh.scale.set(1, len, 1);
}
const _m4 = new THREE.Matrix4(), _bx = V(), _by = V(), _bz = V();
/** Rotate obj so its local +x points along dir, with local +y kept as "up" as possible. */
function orientX(obj, dir) {
  _bx.copy(dir).normalize();
  _by.crossVectors(Z_AXIS, _bx).normalize();
  _bz.crossVectors(_bx, _by);
  _m4.makeBasis(_bx, _by, _bz);
  obj.quaternion.setFromRotationMatrix(_m4);
}
function sampleCurve(curve, out) {
  const n = out.length;
  for (let i = 0; i < n; i++) curve.getPoint(i / (n - 1), out[i]);
}

/**
 * A tube swept along a list of points with an elliptical cross-section that can
 * vary per point (w = half-width along `ref`, h = half-height perpendicular to it).
 * Geometry is rebuilt in place, so it can be animated every frame (neck, wings).
 */
const _sT = V(), _sA1 = V(), _sA2 = V();
class Sweep {
  constructor(count, radial, material, colorFn) {
    this.count = count;
    this.radial = radial;
    const nv = count * radial + 2;
    this.positions = new Float32Array(nv * 3);
    const geo = new THREE.BufferGeometry();
    this.posAttr = new THREE.BufferAttribute(this.positions, 3);
    this.posAttr.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', this.posAttr);
    geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
    const index = [];
    for (let i = 0; i < count - 1; i++) {
      for (let j = 0; j < radial; j++) {
        const j2 = (j + 1) % radial;
        const a = i * radial + j, b = (i + 1) * radial + j, c = (i + 1) * radial + j2, d = i * radial + j2;
        index.push(a, d, b, b, d, c);
      }
    }
    const s0 = count * radial, s1 = s0 + 1, last = (count - 1) * radial;
    for (let j = 0; j < radial; j++) {
      const j2 = (j + 1) % radial;
      index.push(s0, j2, j);
      index.push(s1, last + j, last + j2);
    }
    geo.setIndex(index);
    const colors = new Float32Array(nv * 3);
    const c = new THREE.Color();

        colors.set([c.r, c.g, c.b], (i * radial + j) * 3);

    colorFn(1, 0, c); colors.set([c.r, c.g, c.b], s1 * 3);

    this.mesh = new THREE.Mesh(geo, material);
    this.mesh.frustumCulled = false;
    this.cos = new Float32Array(radial);
    this.sin = new Float32Array(radial);
    for (let j = 0; j < radial; j++) {
      this.cos[j] = Math.cos((j / radial) * Math.PI * 2);
      this.sin[j] = Math.sin((j / radial) * Math.PI * 2);

      _sA2.crossVectors(_sT, _sA1);

        P[k + 1] = p.y + _sA1.y * cw + _sA2.y * sh;
        P[k + 2] = p.z + _sA1.z * cw + _sA2.z * sh;

    P[k] = pts[0].x; P[k + 1] = pts[0].y; P[k + 2] = pts[0].z;

/** Arc-length parameterised closed polyline (used for the chain). */
class LoopCurve extends THREE.Curve {
  constructor(pts) {
    super();
    this.pts = pts;
    this.cum = [0];
    let L = 0;
    for (let i = 0; i < pts.length; i++) {
      L += pts[i].distanceTo(pts[(i + 1) % pts.length]);
      this.cum.push(L);
    }
    this.total = L;
  }
  getPoint(t, target = new THREE.Vector3()) {
    const d = (((t % 1) + 1) % 1) * this.total;
    let i = 0;
    while (i < this.pts.length - 1 && this.cum[i + 1] < d) i++;
    const a = this.pts[i], b = this.pts[(i + 1) % this.pts.length];
    const f = (d - this.cum[i]) / ((this.cum[i + 1] - this.cum[i]) || 1);
    return target.copy(a).lerp(b, f);
  }
}

/* ════════════════════════════ renderer / scene ════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color(0xd4e9f4);
scene.fog = new THREE.Fog(HORIZON, 45, 260);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.3;
controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI * 0.49;
controls.enablePan = false;
controls.autoRotateSpeed = -0.55;

const SUN_DIR = V(0.55, 0.8, 0.18).normalize();

function makeSkyMaterial(sunAmount) {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    toneMapped: false,
    uniforms: {
      top: { value: new THREE.Color(0x3d8ce0) },
      horizon: { value: HORIZON.clone() },
      ground: { value: new THREE.Color(0x8fb873) },
      sunDir: { value: SUN_DIR },
      sunAmt: { value: sunAmount },
    },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 top; uniform vec3 horizon; uniform vec3 ground; uniform vec3 sunDir; uniform float sunAmt;
      varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col = mix(horizon, top, pow(clamp(h, 0.0, 1.0), 0.5));
        col = mix(col, ground, 1.0 - smoothstep(-0.12, 0.0, h));
        float s = max(dot(d, sunDir), 0.0);
        col += vec3(1.0, 0.93, 0.78) * (pow(s, 1200.0) * 4.0 + pow(s, 60.0) * 0.35 + pow(s, 6.0) * 0.1) * sunAmt;
        gl_FragColor = vec4(col, 1.0);
        #include <colorspace_fragment>
      }`,
  });
}

// Image-based lighting from a tiny sky + ground scene, so chrome and water reflect the world.
{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), makeSkyMaterial(0.6)));
  const g = new THREE.Mesh(new THREE.CircleGeometry(48, 32), new THREE.MeshBasicMaterial({ color: 0x5f8f48 }));
  g.rotation.x = -Math.PI / 2; g.position.y = -1.5;
  envScene.add(g);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.02).texture;
  pmrem.dispose();
}

const hemi = new THREE.HemisphereLight(0xd6ecff, 0x56783f, 0.45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3.2, right: 3.2, top: 3.2, bottom: -3.2, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const timeU = { value: 0 };
const unitSphere = new THREE.SphereGeometry(1, 20, 14);

/* ════════════════════════════ world ════════════════════════════ */
const R_PATH = 8.4;                     // the bike's riding radius
const ROAD_IN = 7.2, ROAD_OUT = 8.8;
const POND_R = 4.8;

function noise2(x, z) {
  return Math.sin(x * 0.21 + Math.sin(z * 0.13) * 1.7) * Math.cos(z * 0.17 + Math.sin(x * 0.11) * 1.3);
}

  const r = Math.hypot(x, z);
  const k = smoothstep(16, 48, r);
  return k * (1.7 * Math.sin(x * 0.045 + 0.5) * Math.cos(z * 0.05) + 0.9 * Math.sin(x * 0.11 + z * 0.07) + 0.014 * r);

const world = { ripples: [], clouds: null, birds: [] };

function buildWorld() {
  // sky dome (follows the camera)
  world.sky = new THREE.Mesh(new THREE.SphereGeometry(700, 40, 20), makeSkyMaterial(1));
  world.sky.renderOrder = -1;
  scene.add(world.sky);

  // ground with gentle hills and colour variation

    const x = gp.getX(i), z = gp.getZ(i);

    tc.copy(cA).lerp(cB, 0.5 + 0.5 * noise2(x, z));
    tc.lerp(cC, (0.5 + 0.5 * noise2(x * 2.7 + 7, z * 3.1 - 3)) * 0.35);

  gGeo.computeVertexNormals();
  const ground = new THREE.Mesh(gGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  ground.receiveShadow = true;
  scene.add(ground);

  // the circular bike path
  const asphalt = canvasTexture(256, 256, (g, w, h) => {
    const img = g.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 82 + Math.random() * 34;
      img.data[i] = v; img.data[i + 1] = v + 2; img.data[i + 2] = v + 6; img.data[i + 3] = 255;

    new THREE.RingGeometry(ROAD_IN, ROAD_OUT, 180, 1).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ map: asphalt, color: 0x9aa0a6, roughness: 0.92 })
  );

  scene.add(road);

  const lineMat = new THREE.MeshStandardMaterial({ color: 0xf4f1e8, roughness: 0.7, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  for (const r of [ROAD_IN + 0.08, ROAD_OUT - 0.08]) {
    const m = new THREE.Mesh(new THREE.RingGeometry(r - 0.035, r + 0.035, 180, 1).rotateX(-Math.PI / 2), lineMat);
    m.position.y = 0.002; m.receiveShadow = true; scene.add(m);
  }

  }

  dashes.position.y = 0.002; dashes.receiveShadow = true;
  scene.add(dashes);

  // pond
  const shore = new THREE.Mesh(new THREE.RingGeometry(POND_R - 0.2, POND_R + 0.55, 72, 1).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0xd8c38e, roughness: 1 }));
  shore.position.y = -0.012; shore.receiveShadow = true; scene.add(shore);
  const water = new THREE.Mesh(new THREE.CircleGeometry(POND_R, 72).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x2c7fb8, roughness: 0.06, metalness: 0.1, envMapIntensity: 1.3 }));
  water.position.y = -0.005; water.receiveShadow = true; scene.add(water);

  const padMat = new THREE.MeshStandardMaterial({ color: 0x4f8f3a, roughness: 0.6, side: THREE.DoubleSide });

    const pad = new THREE.Mesh(new THREE.CircleGeometry(s, 22, 0.3, Math.PI * 2 - 0.6).rotateX(-Math.PI / 2), padMat);
    pad.position.set(Math.cos(a) * d, 0.0, Math.sin(a) * d);
    pad.rotation.y = rr(0, Math.PI * 2);
    scene.add(pad);
    if (i % 3 === 0) {
      const fl = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.1, 7, 1, true), lotusMat);
      fl.position.set(pad.position.x + 0.05, 0.05, pad.position.z);
      fl.rotation.x = Math.PI;
      scene.add(fl);
    }
  }
  const rippleGeo = new THREE.RingGeometry(0.92, 1, 48).rotateX(-Math.PI / 2);
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(rippleGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }));
    m.position.y = -0.003;
    scene.add(m);
    world.ripples.push({ mesh: m, t0: -i * 0.9, dur: rr(2.8, 4.2) });
  }

  // reeds and cattails around the pond
  const reedMat = new THREE.MeshStandardMaterial({ color: 0x5f8c3a, roughness: 0.8 });
  const cattailMat = new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.85 });
  for (let c = 0; c < 8; c++) {
    const a = rr(0, Math.PI * 2);
    const cx = Math.cos(a) * (POND_R + 0.05), cz = Math.sin(a) * (POND_R + 0.05);
    for (let k = 0; k < 7; k++) {
      const h = rr(0.55, 1.25);

function makeWheel() {

    const k = smoothstep(-0.8, -0.62, cv) * (1 - smoothstep(-0.2, -0.02, cv));
    c.copy(dark).lerp(wall, k);
    tc.set([c.r, c.g, c.b], i * 3);

  tireGeo.setAttribute('color', new THREE.BufferAttribute(tc, 3));
  g.add(new THREE.Mesh(tireGeo, M.tire));

  rim.scale.z = 1.8;

  hub.rotation.x = Math.PI / 2;

    fl.rotation.x = Math.PI / 2; fl.position.z = 0.032 * s;

      V(0.277 * Math.cos(a), 0.277 * Math.sin(a), 0.004 * side), 0.0021, 5));
  }

function gearGeo(rRoot, rTip, teeth, depth, holes = []) {
  const s = new THREE.Shape();
  const da = (Math.PI * 2) / teeth;
  for (let i = 0; i < teeth; i++) {
    const a = i * da;
    const pts = [[rRoot, a], [rTip, a + da * 0.3], [rTip, a + da * 0.5], [rRoot, a + da * 0.8]];
    pts.forEach(([r, ang], k) => {
      const x = r * Math.cos(ang), y = r * Math.sin(ang);
      if (i === 0 && k === 0) s.moveTo(x, y); else s.lineTo(x, y);
    });
  }
  s.closePath();
  for (const [hx, hy, hr] of holes) {
    const p = new THREE.Path();
    p.absarc(hx, hy, hr, 0, Math.PI * 2, true);
    s.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 10 });
  g.translate(0, 0, -depth / 2);
  return g;
}

const _d = V(), _p = V(), _hip = V(), _knee = V(), _ankle = V(), _kneeTop = V(), _grip = V(), _off = V(), _dir = V(), _camL = V();

function solveIK(hip, target, a, b, pole, outKnee) {
  _d.subVectors(target, hip);
  let dist = _d.length();
  _d.divideScalar(dist || 1);
  dist = clamp(dist, Math.abs(a - b) + 1e-3, (a + b) * 0.999);
  const cosA = clamp((a * a + dist * dist - b * b) / (2 * a * dist), -1, 1);
  const sinA = Math.sqrt(1 - cosA * cosA);
  _p.copy(pole).addScaledVector(_d, -pole.dot(_d)).normalize();
  outKnee.copy(hip).addScaledVector(_d, a * cosA).addScaledVector(_p, a * sinA);
}

  bodyG.updateMatrix();

  // head: stabilised like a real bird's, with an occasional curious look at the camera
  const m = now % 13;
  const look = smoothstep(7, 7.9, m) * (1 - smoothstep(10.2, 11.1, m));
  let yawC = 0, pitchC = 0;
  if (look > 0) {
    _camL.copy(camera.position);
    bike.worldToLocal(_camL);
    _camL.sub(HEAD_POS);
    yawC = clamp(Math.atan2(-_camL.z, _camL.x), -1.15, 1.15);
    pitchC = clamp(Math.atan2(_camL.y, Math.hypot(_camL.x, _camL.z)), -0.45, 0.35);
  }
  headG.position.set(HEAD_POS.x + 0.005 * Math.sin(2 * crank), HEAD_POS.y + 0.007 * Math.sin(2 * crank + 1.2), 0);
  headG.rotation.set(0, lerp(0.08, yawC, look), HEAD_PITCH + 0.02 * Math.sin(2 * crank) + pitchC * look);
  headG.updateMatrix();

  // blink
  let eyeS = 1;
  const bt = now - nextBlink;
  if (bt > 0) {
    if (bt < 0.16) eyeS = Math.max(0.08, Math.abs(1 - bt / 0.08));
    else nextBlink = now + 2 + Math.random() * 3.5;
  }
  for (const e of eyes) e.scale.y = eyeS;

  // pouch wobble
  pouchG.scale.y = 1 + 0.06 * Math.sin(now * 8.5) * (0.6 + 0.4 * Math.sin(now * 0.7)) + 0.05 * Math.sin(2 * crank + 0.8);

  // neck
  neckCtrl[0].set(0.18, 0.05, 0).applyMatrix4(bodyG.matrix);
  neckCtrl[1].set(0.31, 0.15, 0).applyMatrix4(bodyG.matrix);
  neckCtrl[3].set(-0.065, -0.055, 0).applyMatrix4(headG.matrix);
  neckCtrl[4].set(-0.02, -0.01, 0).applyMatrix4(headG.matrix);
  neckCtrl[2].lerpVectors(neckCtrl[1], neckCtrl[3], 0.5).add(_off.set(-0.065, 0, 0));
  sampleCurve(neckCurve, neckPts);
  neck.update(neckPts, neckW, neckH);

  // wings: shoulder (on the body) → elbow → wrist on the grip (on the steering)
  for (const W of wings) {
    const s = W.side, c = W.ctrl;
    c[0].set(-0.03, 0.07, 0.13 * s).applyMatrix4(bodyG.matrix);
    c[1].set(0.15, 0.07, 0.2 * s).applyMatrix4(bodyG.matrix);
    _grip.set(GRIP.x, GRIP.y, GRIP.z * s).applyMatrix4(steer.matrix);
    c[3].copy(_grip).add(_off.set(-0.075, 0.03, 0));
    c[4].copy(_grip).add(_off.set(0.012, 0.004, 0));
    c[2].lerpVectors(c[1], c[3], 0.5).add(_off.set(-0.03, -0.025 + 0.012 * Math.sin(crank + (s > 0 ? 0 : Math.PI)), 0.085 * s));
    sampleCurve(W.curve, W.pts);
    W.sweep.update(W.pts, wingW, wingH);
    W.hand.position.copy(_grip);
    orientX(W.hand, _dir.subVectors(c[4], c[3]));
  }

  // legs: feet ride the pedals, two-bone IK up to the hips
  for (const L of legs) {
    const a = crank + (L.side > 0 ? 0 : Math.PI);
    const px = BB.x + CRANK * Math.cos(a), py = BB.y + CRANK * Math.sin(a), pz = 0.15 * L.side;
    L.pedal.position.set(px, py, pz);
    L.foot.position.set(px, py + 0.013, pz);
    L.foot.rotation.z = 0.15 * Math.cos(a) - 0.06;
    L.foot.updateMatrix();
    _ankle.copy(ANKLE_L).applyMatrix4(L.foot.matrix);
    _hip.set(HIP_L.x, HIP_L.y, HIP_L.z * L.side).applyMatrix4(bodyG.matrix);
    _p.set(1, 0.1, 0.3 * L.side);
    solveIK(_hip, _ankle, THIGH, SHIN, _p.clone(), _knee);
    _kneeTop.lerpVectors(_hip, _knee, 0.9);
    placeBetween(L.thigh, _hip, _kneeTop);
    L.kneeCap.position.copy(_kneeTop);
    L.knee.position.copy(_knee);
    placeBetween(L.shin, _knee, _ankle);
    L.ankle.position.copy(_ankle);
  }
}

/* ════════════════════════════ camera modes & UI ════════════════════════════ */
const CAM_OFFSET = V(2.1, 0.62, 3.5);     // in the bike's yaw frame: ahead, up, outside
const WIDE_POS = V(17, 11.5, 19), WIDE_TARGET = V(0, 0.4, 0);
let camMode = 'cinematic';
let tween = null;
let prevYaw = null;
let lastInteract = -10;
let interacting = false;
controls.addEventListener('start', () => { interacting = true; });
controls.addEventListener('end', () => { interacting = false; lastInteract = clock.elapsedTime; });

const camButtons = [...document.querySelectorAll('[data-cam]')];
function setCamMode(mode, dur = 1.3) {
  camMode = mode;
  camButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cam === mode)));
  tween = { t: 0, dur, fromPos: camera.position.clone(), fromTarget: controls.target.clone() };
}
camButtons.forEach((b) => b.addEventListener('click', () => setCamMode(b.dataset.cam)));

let paused = false;
const pauseBtn = document.getElementById('pauseBtn');
function setPaused(p) {
  paused = p;
  pauseBtn.textContent = p ? '▶ Play' : '❚❚ Pause';
  pauseBtn.setAttribute('aria-pressed', String(p));
}
pauseBtn.addEventListener('click', () => setPaused(!paused));

let speedMul = 1;
const speedIn = document.getElementById('speed'), speedOut = document.getElementById('speedVal');
speedIn.addEventListener('input', () => {
  speedMul = parseFloat(speedIn.value);
  speedOut.textContent = speedMul.toFixed(1) + '×';
});

window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('button, input')) return;
  if (e.code === 'Space') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === 'c' || e.key === 'C') {
    const order = ['cinematic', 'chase', 'wide'];
    setCamMode(order[(order.indexOf(camMode) + 1) % order.length]);
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ════════════════════════════ main loop ════════════════════════════ */
const BASE_SPEED = 3.0;   // m/s
const clock = new THREE.Clock();
let rideDist = 0, lean = 0;
const bikeTarget = V();

camera.position.copy(WIDE_POS);
controls.target.copy(WIDE_TARGET);
setCamMode('cinematic', 2.6);

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = clock.elapsedTime;
  timeU.value = now;

  if (!paused) rideDist += BASE_SPEED * speedMul * dt;
  const phi = rideDist / R_PATH;
  const yaw = phi + Math.PI / 2;
  const v = BASE_SPEED * speedMul;
  if (!paused) lean += (Math.atan((v * v) / (9.81 * R_PATH)) - lean) * Math.min(1, dt * 2.5);

  const wheelAng = -rideDist / WR;
  const crank = wheelAng / GEAR + 0.6;

  bike.position.set(R_PATH * Math.cos(phi), 0, -R_PATH * Math.sin(phi));
  bike.rotation.set(-lean + 0.012 * Math.sin(crank), yaw, 0);
  rearWheel.rotation.z = wheelAng;
  frontWheel.rotation.z = wheelAng;
  crankG.rotation.z = crank;
  setSteer(Math.atan(WHEELBASE / R_PATH) + 0.022 * Math.sin(crank + 0.5));
  chainTex.offset.x = ((-crank * 0.088) / chainLen) * chainTex.repeat.x;
  bike.updateMatrixWorld(true);

  updatePelican(crank, now);

  // world life
  for (const r of world.ripples) {
    let age = (now - r.t0) / r.dur;
    if (age >= 1) {
      r.t0 = now; age = 0; r.dur = rr(2.8, 4.2);
      const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * (POND_R - 1.2);
      r.mesh.position.set(Math.cos(a) * d, -0.003, Math.sin(a) * d);
    }
    if (age < 0) { r.mesh.material.opacity = 0; continue; }
    const s = 0.12 + age * 1.1;
    r.mesh.scale.set(s, 1, s);
    r.mesh.material.opacity = 0.45 * (1 - age) * smoothstep(0, 0.08, age);
  }
  world.clouds.rotation.y = now * 0.004;
  for (const b of world.birds) {
    const ang = now * 0.05 + b.off;
    b.g.position.set(Math.cos(ang) * b.r - 8, b.h + Math.sin(now * 0.4 + b.ph) * 0.6, -Math.sin(ang) * b.r + 6);
    b.g.rotation.y = ang + Math.PI / 2 + Math.PI;
    const flap = Math.sin(now * 3.2 + b.ph) * 0.55;
    b.wl.rotation.x = -flap; b.wr.rotation.x = flap;
  }

  // camera
  bikeTarget.set(bike.position.x, 0.95, bike.position.z);
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / tween.dur);
    const e = easeInOut(tween.t);
    const toT = camMode === 'wide' ? WIDE_TARGET : bikeTarget;
    const toP = camMode === 'wide' ? WIDE_POS : _t2.copy(CAM_OFFSET).applyAxisAngle(UP, yaw).add(bikeTarget);
    controls.target.lerpVectors(tween.fromTarget, toT, e);
    camera.position.lerpVectors(tween.fromPos, toP, e);
    if (tween.t >= 1) tween = null;
  } else if (camMode !== 'wide') {
    // follow the rider; rotate with it so the framing holds while it circles the pond
    _t3.subVectors(bikeTarget, controls.target);
    camera.position.add(_t3);
    controls.target.copy(bikeTarget);
    if (prevYaw !== null) {
      _t2.subVectors(camera.position, bikeTarget).applyAxisAngle(UP, yaw - prevYaw);
      camera.position.copy(bikeTarget).add(_t2);
    }
  }
  prevYaw = yaw;
  controls.autoRotate = camMode === 'cinematic' && !tween && !interacting && now - lastInteract > 3;
  controls.update();

  world.sky.position.copy(camera.position);
  sun.target.position.copy(bike.position);
  sun.position.copy(bike.position).addScaledVector(SUN_DIR, 15);

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);
</script>
<script>
  setTimeout(function () {
    if (!window.__pelicanStarted) document.getElementById('fallback').style.display = 'grid';
  }, 8000);
</script>
</body>
</html>
