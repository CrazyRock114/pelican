<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; color: #fff; font-size: 13px;
    background: rgba(0,0,0,.35); padding: 8px 12px; border-radius: 8px; user-select: none;
  }
  #hud input { vertical-align: middle; }
</style>
</head>
<body>
<div id="hud">
  Drag to orbit · scroll to zoom &nbsp;|&nbsp;
  Speed <input id="speed" type="range" min="0" max="3" step="0.05" value="1">
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 18, 55);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(2.2, 1.7, 4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

scene.add(new THREE.HemisphereLight(0xdff3ff, 0x5a7a3a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 25 });
scene.add(sun);

// ---------- helpers ----------
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
const UP = new THREE.Vector3(0, 1, 0);
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 12);

function shadow(m) { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; }

// A cylinder mesh that can be re-aimed between two points every frame
function rod(radius, material, parent) {
  const m = new THREE.Mesh(unitCyl, material);
  m.userData.r = radius;
  m.castShadow = true;
  parent.add(m);
  return m;
}
const _d = new THREE.Vector3();
function aim(m, a, b) {
  _d.subVectors(b, a);
  const len = _d.length();
  m.position.copy(a).addScaledVector(_d, 0.5);
  m.scale.set(m.userData.r, len, m.userData.r);
  m.quaternion.setFromUnitVectors(UP, _d.normalize());
}
function tube(parent, radius, material, a, b) {
  const m = rod(radius, material, parent);
  aim(m, a, b);
  return m;
}
const v = (x, y, z = 0) => new THREE.Vector3(x, y, z);

// ---------- world (scrolling) ----------
const world = new THREE.Group();
scene.add(world);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), mat(0x7cc456, { roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const road = new THREE.Mesh(new THREE.PlaneGeometry(200, 2.4), mat(0x55585e, { roughness: 0.95 }));
road.rotation.x = -Math.PI / 2;
road.position.y = 0.005;
road.receiveShadow = true;
scene.add(road);

const SPAN = 60; // length of recycled strip
const dashes = [];
const dashMat = mat(0xf5f5f0);
for (let i = 0; i < 30; i++) {
  const d = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.08), dashMat);
  d.rotation.x = -Math.PI / 2;
  d.position.set(-SPAN / 2 + i * 2, 0.01, -0.75);
  d.receiveShadow = true;
  world.add(d); dashes.push(d);
}

function makeTree() {
  const g = new THREE.Group();
  const h = 0.8 + Math.random() * 0.8;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, h, 8), mat(0x7a5232));
  trunk.position.y = h / 2;
  g.add(trunk);
  const leafMat = mat([0x2f8f3a, 0x3fa34a, 0x2a7d36][Math.random() * 3 | 0]);
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.7 - i * 0.15, 0.9, 10), leafMat);
    c.position.y = h + 0.25 + i * 0.45;
    g.add(c);
  }
  return shadow(g);
}
const props = [];
for (let i = 0; i < 40; i++) {
  const t = makeTree();
  const side = Math.random() < 0.5 ? -1 : 1;
  t.position.set(-SPAN / 2 + Math.random() * SPAN, 0, side * (2.2 + Math.random() * 9));
  t.scale.setScalar(0.8 + Math.random() * 0.6);
  world.add(t); props.push(t);
}
for (let i = 0; i < 12; i++) { // flowers / rocks
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.12 + Math.random() * 0.15), mat(0x9a9a92));
  r.position.set(-SPAN / 2 + Math.random() * SPAN, 0.05, (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random() * 3));
  shadow(r); world.add(r); props.push(r);
}

const clouds = [];
const cloudMat = mat(0xffffff, { roughness: 1, emissive: 0x666666 });
for (let i = 0; i < 10; i++) {
  const c = new THREE.Group();
  for (let j = 0; j < 5; j++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.6 + Math.random() * 0.6, 12, 10), cloudMat);
    s.position.set(j * 0.8 - 1.6, Math.random() * 0.4, Math.random() * 0.6);
    c.add(s);
  }
  c.position.set(-40 + Math.random() * 80, 8 + Math.random() * 5, -15 - Math.random() * 20);
  scene.add(c); clouds.push(c);
}

// ---------- bicycle ----------
const bike = new THREE.Group();
scene.add(bike);

const R = 0.35;                 // wheel radius
const rearAxle = v(-0.58, R), frontAxle = v(0.58, R);
const bb = v(0, 0.3);           // bottom bracket (crank centre)
const seatTop = v(-0.17, 0.86), headTop = v(0.43, 0.88), headBot = v(0.48, 0.68);
const frameMat = mat(0xd7263d, { metalness: 0.4, roughness: 0.35 });
const chrome = mat(0xcfd3d8, { metalness: 0.9, roughness: 0.25 });
const black = mat(0x1d1d1f, { roughness: 0.8 });

function wheel() {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(R, 0.028, 12, 48), black);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R - 0.03, 0.012, 8, 48), chrome);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.1, 12), chrome);
  hub.rotation.x = Math.PI / 2;
  g.add(tire, rim, hub);
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const z = i % 2 ? 0.035 : -0.035;
    tube(g, 0.003, chrome, v(0, 0, z), v(Math.cos(a) * (R - 0.035), Math.sin(a) * (R - 0.035), 0));
  }
  return shadow(g);
}
const rearWheel = wheel(); rearWheel.position.copy(rearAxle); bike.add(rearWheel);
const frontWheel = wheel(); frontWheel.position.copy(frontAxle); bike.add(frontWheel);

// frame (double tubes for stays at ±z)
tube(bike, 0.025, frameMat, bb, seatTop);          // seat tube
tube(bike, 0.025, frameMat, bb, headBot);          // down tube
tube(bike, 0.022, frameMat, seatTop.clone().add(v(0.02, -0.06)), headTop); // top tube
tube(bike, 0.028, frameMat, headBot, headTop);     // head tube
for (const z of [-0.05, 0.05]) {
  tube(bike, 0.013, frameMat, v(bb.x, bb.y, z * 0.6), v(rearAxle.x, rearAxle.y, z));                 // chain stay
  tube(bike, 0.012, frameMat, v(seatTop.x + 0.01, seatTop.y - 0.05, z * 0.4), v(rearAxle.x, rearAxle.y, z)); // seat stay
  tube(bike, 0.014, chrome, v(headBot.x, headBot.y, z * 0.6), v(frontAxle.x, frontAxle.y, z));        // fork
}
// seat post + saddle
const saddleTop = v(-0.2, 0.96);
tube(bike, 0.015, chrome, seatTop, saddleTop);
const saddle = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 10), black);
saddle.scale.set(1.4, 0.3, 0.7); saddle.position.copy(saddleTop).add(v(0.02, 0.02));
bike.add(saddle);
// stem + handlebars
const stemTop = v(0.4, 1.0);
tube(bike, 0.016, chrome, headTop, stemTop);
const barL = v(0.48, 1.0, -0.24), barR = v(0.48, 1.0, 0.24);
tube(bike, 0.014, chrome, barL, barR);
tube(bike, 0.014, chrome, stemTop, v(0.48, 1.0));
for (const b of [barL, barR]) {
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.1, 10), black);
  grip.rotation.x = Math.PI / 2; grip.position.copy(b).add(v(0, 0, Math.sign(b.z) * -0.04));
  bike.add(grip);
}
// bell
const bell = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xffd23f, { metalness: 0.7, roughness: 0.3 }));
bell.position.set(0.48, 1.015, 0.13); bike.add(bell);
// chainring + chain
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.012, 8, 32), chrome);
ring.position.copy(bb).add(v(0, 0, 0.07)); bike.add(ring);
const cog = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.01, 8, 24), chrome);
cog.position.copy(rearAxle).add(v(0, 0, 0.07)); bike.add(cog);
const chainMat = mat(0x444444, { metalness: 0.7 });
tube(bike, 0.006, chainMat, v(bb.x, bb.y + 0.1, 0.07), v(rearAxle.x, rearAxle.y + 0.045, 0.07));
tube(bike, 0.006, chainMat, v(bb.x, bb.y - 0.1, 0.07), v(rearAxle.x, rearAxle.y - 0.045, 0.07));
// cranks (rotating)
const crank = new THREE.Group();
crank.position.copy(bb); bike.add(crank);
const CR = 0.17;
const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.22, 10), chrome);
axle.rotation.x = Math.PI / 2; crank.add(axle);
const pedalMeshes = [];
for (const s of [1, -1]) {
  const z = s * 0.1;
  tube(crank, 0.012, chrome, v(0, 0, z), v(s * CR, 0, z));
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.07), black);
  p.position.set(s * CR, 0, z + s * 0.04);
  crank.add(p); pedalMeshes.push(p);
}
shadow(bike);

// ---------- pelican ----------
const pel = new THREE.Group();
bike.add(pel);
const white = mat(0xf7f5ef, { roughness: 0.85 });
const grey = mat(0x9aa3ad, { roughness: 0.85 });
const dark = mat(0x2b2f36, { roughness: 0.8 });
const beakMat = mat(0xf3a531, { roughness: 0.5 });
const pouchMat = mat(0xf07f5b, { roughness: 0.55 });
const legMat = mat(0xf09a3e, { roughness: 0.6 });

const torso = new THREE.Group();
torso.position.set(-0.1, 1.18, 0);
pel.add(torso);
const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), white);
bodyMesh.scale.set(0.42, 0.27, 0.27);
bodyMesh.rotation.z = 0.35;
torso.add(bodyMesh);
// tail
const tail = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.3, 12), grey);
tail.rotation.z = Math.PI / 2 + 0.6; tail.position.set(-0.43, -0.12, 0); tail.scale.z = 0.5;
torso.add(tail);

// wings: pivot at shoulder, reaching toward handlebar
const wings = [];
for (const s of [1, -1]) {
  const pivot = new THREE.Group();
  pivot.position.set(0.12, 0.08, s * 0.24);
  const w = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), grey);
  w.scale.set(0.36, 0.08, 0.13);
  w.position.set(0.22, -0.06, s * 0.03);
  w.rotation.z = -0.35;
  const tip = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), dark);
  tip.scale.set(0.16, 0.05, 0.09);
  tip.position.set(0.5, -0.17, s * 0.04);
  tip.rotation.z = -0.4;
  pivot.add(w, tip);
  torso.add(pivot);
  wings.push(pivot);
}

// neck (S-curve tube) + head
const neckCurve = new THREE.CatmullRomCurve3([
  v(0.22, 0.12), v(0.3, 0.3), v(0.22, 0.48), v(0.3, 0.66)
]);
const neck = new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 24, 0.075, 12), white);
torso.add(neck);
const head = new THREE.Group();
head.position.set(0.32, 0.7, 0);
torso.add(head);
const skull = new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 16), white);
skull.scale.set(1.15, 1, 0.95);
head.add(skull);
const crest = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), mat(0xfff2b0));
crest.position.set(-0.04, 0.08, 0); crest.scale.set(1.5, 0.6, 0.8);
head.add(crest);
for (const s of [1, -1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), dark);
  eye.position.set(0.04, 0.025, s * 0.095);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.026, 0.006, 6, 16), mat(0xf6c8a8));
  ring.position.copy(eye.position); ring.lookAt(eye.position.clone().multiplyScalar(2));
  head.add(eye, ring);
}
// beak: upper mandible + hinged lower jaw with pouch
const BEAK = 0.62;
const upper = new THREE.Mesh(new THREE.ConeGeometry(0.045, BEAK, 12), beakMat);
upper.rotation.z = -Math.PI / 2; upper.scale.z = 0.7;
upper.position.set(0.08 + BEAK / 2, -0.01, 0);
head.add(upper);
const hook = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), mat(0xe2622b));
hook.position.set(0.08 + BEAK - 0.02, -0.02, 0); head.add(hook);
const jaw = new THREE.Group();
jaw.position.set(0.07, -0.035, 0);
head.add(jaw);
const lower = new THREE.Mesh(new THREE.ConeGeometry(0.035, BEAK * 0.97, 10), beakMat);
lower.rotation.z = -Math.PI / 2; lower.scale.z = 0.8;
lower.position.set(BEAK / 2, 0, 0);
jaw.add(lower);
const pouch = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), pouchMat);
pouch.scale.set(BEAK * 0.45, 0.11, 0.06);
pouch.position.set(BEAK * 0.45, 0.005, 0);
jaw.add(pouch);

// legs: thigh + shin solved with 2-bone IK each frame
const L1 = 0.46, L2 = 0.46;
const legs = [1, -1].map(s => {
  const thigh = rod(0.045, white, pel);
  const shin = rod(0.022, legMat, pel);
  const knee = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 8), legMat); knee.castShadow = true; pel.add(knee);
  const foot = new THREE.Group(); pel.add(foot);
  const web = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.14, 3), legMat);
  web.rotation.z = -Math.PI / 2; web.scale.set(1, 1, 0.25); web.position.x = 0.03; web.castShadow = true;
  foot.add(web);
  return { s, thigh, shin, knee, foot, hip: v(-0.12, 1.0, s * 0.12) };
});
shadow(pel);

// ---------- animation ----------
const speedInput = document.getElementById('speed');
const clock = new THREE.Clock();
let crankAngle = 0, wheelAngle = 0, dist = 0;
const GEAR = 2.2; // wheel turns per crank turn
const tmpKnee = new THREE.Vector3(), tmpFoot = new THREE.Vector3(), tmpHip = new THREE.Vector3();

function solveLeg(leg, footLocal) {
  const hip = tmpHip.copy(leg.hip);
  hip.y += torso.position.y - 1.18;
  const dx = footLocal.x - hip.x, dy = footLocal.y - hip.y;
  let d = Math.hypot(dx, dy);
  d = Math.min(d, L1 + L2 - 1e-3);
  const base = Math.atan2(dy, dx);
  const a = Math.acos(THREE.MathUtils.clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  const ang = base + a; // knee bends forward
  tmpKnee.set(hip.x + Math.cos(ang) * L1, hip.y + Math.sin(ang) * L1, (hip.z + footLocal.z) / 2);
  aim(leg.thigh, hip, tmpKnee);
  aim(leg.shin, tmpKnee, footLocal);
  leg.knee.position.copy(tmpKnee);
  leg.foot.position.copy(footLocal);
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const speed = parseFloat(speedInput.value);
  const vel = speed * 2.2; // m/s

  wheelAngle -= (vel / R) * dt;
  crankAngle = wheelAngle / GEAR;
  dist += vel * dt;
  rearWheel.rotation.z = frontWheel.rotation.z = wheelAngle;
  crank.rotation.z = crankAngle;
  // keep pedals flat
  for (const p of pedalMeshes) p.rotation.z = -crankAngle;

  // scroll world
  for (const d of dashes) { d.position.x -= vel * dt; if (d.position.x < -SPAN / 2) d.position.x += SPAN; }
  for (const p of props) { p.position.x -= vel * dt; if (p.position.x < -SPAN / 2) p.position.x += SPAN; }
  for (const c of clouds) { c.position.x -= vel * dt * 0.1; if (c.position.x < -45) c.position.x += 90; }

  // bike sway & bob
  const cadence = crankAngle;
  bike.rotation.x = Math.sin(cadence) * 0.03 * Math.min(speed, 1.5);
  bike.position.y = Math.abs(Math.sin(dist * 3)) * 0.004;
  // pelican body
  torso.position.y = 1.18 + Math.sin(cadence * 2) * 0.015;
  torso.rotation.z = -0.05 + Math.sin(cadence * 2) * 0.02;
  torso.rotation.x = Math.sin(cadence) * 0.04;
  head.rotation.z = Math.sin(t * 1.7) * 0.08 - 0.05;
  head.rotation.y = Math.sin(t * 0.6) * 0.25;
  jaw.rotation.z = -(Math.max(0, Math.sin(t * 0.9)) ** 8) * 0.35; // occasional squawk
  pouch.scale.y = 0.11 + Math.sin(t * 3) * 0.01;
  wings.forEach((w, i) => {
    w.rotation.x = (i ? -1 : 1) * (0.05 + Math.sin(t * 2 + i) * 0.04);
    w.rotation.z = Math.sin(t * 1.3) * 0.04;
  });

  // pedals -> feet (in bike space)
  legs.forEach((leg, i) => {
    const a = crankAngle + (i ? Math.PI : 0);
    tmpFoot.set(bb.x + Math.cos(a) * CR, bb.y + Math.sin(a) * CR + 0.035, leg.s * 0.15);
    solveLeg(leg, tmpFoot);
  });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
