<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a8d8f0; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; }
  #title {
    position: fixed; top: 14px; left: 16px; color: #1d3346;
    background: rgba(255,255,255,.75); padding: 8px 12px; border-radius: 10px;
    font-weight: 600; font-size: 15px; backdrop-filter: blur(4px);
  }
  #title small { display: block; font-weight: 400; font-size: 12px; opacity: .7; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: rgba(255,255,255,.75); padding: 8px 12px; border-radius: 10px; font-size: 13px; color: #1d3346;
    backdrop-filter: blur(4px); max-width: calc(100vw - 56px);
  }
  button {
    font: inherit; border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer;
    background: #1d3346; color: #fff;
  }
  button:hover { background: #2d5170; }
  label { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="title">Pelican on a Bicycle<small>Drag to orbit · scroll to zoom</small></div>
<div id="hud">
  <button id="pause">Pause</button>
  <button id="cam">Camera: Follow</button>
  <label>Speed <input type="range" id="speed" min="0" max="3" step="0.1" value="1"></label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------------------------------------------------------------- setup
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const SKY = 0xa8d8f0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 28, 75);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(10, 3.2, 3);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 1.8;
controls.maxDistance = 40;

scene.add(new THREE.HemisphereLight(0xe6f4ff, 0x5d7d3c, 0.75));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.95);
sun.position.set(8, 16, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 50 });
sun.shadow.bias = -0.0006;
scene.add(sun);

// ---------------------------------------------------------------- helpers
const v = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const UP = v(0, 1, 0), XAX = v(1, 0, 0);
const M = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.65, metalness: 0 }, o));
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 12);
const unitSph = new THREE.SphereGeometry(1, 22, 16);

function sh(m) { m.castShadow = true; m.receiveShadow = true; return m; }
// cylinder from a to b
function setRod(m, a, b, r) {
  const d = b.clone().sub(a), L = d.length();
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(UP, d.divideScalar(L));
  m.scale.set(r, L, r);
}
function rod(a, b, r, mat) { const m = sh(new THREE.Mesh(unitCyl, mat)); setRod(m, a, b, r); return m; }
// ellipsoid stretched between a and b
function setBlob(m, a, b, ty, tz) {
  const d = b.clone().sub(a), L = d.length();
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(XAX, d.divideScalar(L));
  m.scale.set(L / 2, ty, tz);
}
function blob(mat) { return sh(new THREE.Mesh(unitSph, mat)); }
function ball(pos, r, mat) { const m = blob(mat); m.position.copy(pos); m.scale.setScalar(r); return m; }

let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------------------------------------------------------------- world
const TRACK_R = 7;

const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 64), M(0x86c35e, { roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const road = new THREE.Mesh(new THREE.RingGeometry(TRACK_R - 0.9, TRACK_R + 0.9, 160), M(0x5a5d63, { roughness: 0.95 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.01; road.receiveShadow = true;
scene.add(road);
for (const r of [TRACK_R - 0.9, TRACK_R + 0.9]) {
  const curb = new THREE.Mesh(new THREE.RingGeometry(r - 0.06, r + 0.06, 160), M(0xe8e4d8));
  curb.rotation.x = -Math.PI / 2; curb.position.y = 0.015; curb.receiveShadow = true;
  scene.add(curb);
}
const dashGeo = new THREE.PlaneGeometry(0.08, 0.45);
dashGeo.rotateX(-Math.PI / 2);
const dashMat = M(0xfff6c8);
for (let i = 0; i < 56; i++) {
  const g = new THREE.Group();
  const d = new THREE.Mesh(dashGeo, dashMat);
  d.position.set(TRACK_R, 0.02, 0); d.receiveShadow = true;
  g.add(d); g.rotation.y = (i / 56) * Math.PI * 2;
  scene.add(g);
}

// central pond (pelicans like water)
const sand = new THREE.Mesh(new THREE.CircleGeometry(3.7, 64), M(0xe3d3a3, { roughness: 1 }));
sand.rotation.x = -Math.PI / 2; sand.position.y = 0.012; sand.receiveShadow = true;
scene.add(sand);
const water = new THREE.Mesh(new THREE.CircleGeometry(3.1, 64), M(0x3d93c9, { roughness: 0.15, metalness: 0.2 }));
water.rotation.x = -Math.PI / 2; water.position.y = 0.025; water.receiveShadow = true;
scene.add(water);
const reedMat = M(0x5f8f3a);
for (let i = 0; i < 40; i++) {
  const a = rand() * Math.PI * 2, r = 3.15 + rand() * 0.4, h = 0.4 + rand() * 0.5;
  const reed = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.015, h, 4), reedMat));
  reed.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
  reed.rotation.set((rand() - 0.5) * 0.3, 0, (rand() - 0.5) * 0.3);
  scene.add(reed);
}

// jumping fish
const fish = new THREE.Group();
const fishBody = ball(v(0, 0, 0), 1, M(0xa7b8c4, { metalness: 0.5, roughness: 0.3 }));
fishBody.scale.set(0.16, 0.06, 0.04);
const fishTail = sh(new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.1, 3), fishBody.material));
fishTail.rotation.z = -Math.PI / 2; fishTail.position.x = -0.18;
fish.add(fishBody, fishTail);
fish.visible = false;
scene.add(fish);
const fishState = { t: 0, next: 2, x: 0, z: 0, dir: 0 };

// trees
const trunkMat = M(0x7a5232);
const leafMats = [0x3f8f3a, 0x4d9e3f, 0x2f7a3a, 0x6aa84a].map(c => M(c, { flatShading: true, roughness: 0.9 }));
function tree(x, z, s) {
  const g = new THREE.Group();
  const trunk = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.13, 0.9, 7), trunkMat));
  trunk.position.y = 0.45; g.add(trunk);
  const mat = leafMats[Math.floor(rand() * leafMats.length)];
  if (rand() < 0.5) {
    for (let k = 0; k < 3; k++) {
      const c = sh(new THREE.Mesh(new THREE.ConeGeometry(0.75 - k * 0.18, 0.9, 8), mat));
      c.position.y = 1.0 + k * 0.45; c.rotation.y = rand() * 3; g.add(c);
    }
  } else {
    const c = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.75, 0), mat));
    c.position.y = 1.4; c.rotation.set(rand(), rand(), rand()); g.add(c);
    const c2 = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 0), mat));
    c2.position.set(0.35, 1.15, 0.2); g.add(c2);
  }
  g.position.set(x, 0, z); g.scale.setScalar(s); g.rotation.y = rand() * 6;
  scene.add(g);
}
for (let i = 0; i < 70; i++) {
  const a = rand() * Math.PI * 2, r = 9.6 + rand() * 22;
  tree(Math.cos(a) * r, Math.sin(a) * r, 0.8 + rand() * 0.9);
}
// bushes and flowers
const flowerMats = [0xff6f91, 0xffd23f, 0xffffff, 0xb388ff].map(c => M(c));
for (let i = 0; i < 90; i++) {
  const a = rand() * Math.PI * 2;
  const r = rand() < 0.5 ? 4.0 + rand() * 1.9 : 8.2 + rand() * 6;
  const f = sh(new THREE.Mesh(new THREE.IcosahedronGeometry(0.05, 0), flowerMats[i % 4]));
  f.position.set(Math.cos(a) * r, 0.06, Math.sin(a) * r);
  scene.add(f);
}

// clouds
const cloudMat = M(0xffffff, { roughness: 1 });
const clouds = [];
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group();
  for (let k = 0; k < 5; k++) {
    const p = new THREE.Mesh(unitSph, cloudMat);
    p.position.set((k - 2) * 0.9, Math.sin(k) * 0.3, (rand() - 0.5) * 0.8);
    p.scale.setScalar(0.7 + rand() * 0.6);
    g.add(p);
  }
  const a = rand() * Math.PI * 2, r = 14 + rand() * 20;
  g.position.set(Math.cos(a) * r, 11 + rand() * 6, Math.sin(a) * r);
  g.userData = { a, r, s: 0.005 + rand() * 0.01 };
  scene.add(g); clouds.push(g);
}

// ---------------------------------------------------------------- bicycle
// local frame: +x forward, +y up, +z to the rider's left
const rig = new THREE.Group();
rig.rotation.order = 'YXZ';
scene.add(rig);

const frameMat = M(0x1f6fd1, { roughness: 0.3, metalness: 0.35 });
const chrome = M(0xd8dde2, { roughness: 0.2, metalness: 0.95 });
const rubber = M(0x1b1b1b, { roughness: 0.9 });
const leather = M(0x5a3420, { roughness: 0.6 });

const WR = 0.36;
const rearAxle = v(-0.58, WR), frontAxle = v(0.6, WR), bb = v(0, 0.32);
const seatJoint = v(-0.17, 0.86), headTop = v(0.47, 0.92), headBot = v(0.51, 0.76);

function wheel() {
  const g = new THREE.Group();
  g.add(sh(new THREE.Mesh(new THREE.TorusGeometry(WR, 0.032, 10, 56), rubber)));
  g.add(sh(new THREE.Mesh(new THREE.TorusGeometry(WR - 0.032, 0.012, 6, 56), chrome)));
  const hub = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.1, 12), chrome));
  hub.rotation.x = Math.PI / 2; g.add(hub);
  const spokeMat = M(0xbfc5ca, { metalness: 0.8, roughness: 0.3 });
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2, side = i % 2 ? 0.04 : -0.04;
    g.add(rod(v(0, 0, side), v(Math.cos(a) * (WR - 0.035), Math.sin(a) * (WR - 0.035), 0), 0.0035, spokeMat));
  }
  // a reflector so the spin reads clearly
  const refl = sh(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.01), M(0xff8a00, { emissive: 0x552200 })));
  refl.position.set(0, WR * 0.6, 0.045); g.add(refl);
  return g;
}
const rearWheel = wheel(); rearWheel.position.copy(rearAxle); rig.add(rearWheel);
const frontWheel = wheel(); frontWheel.position.copy(frontAxle); rig.add(frontWheel);

// frame
rig.add(rod(bb, seatJoint, 0.022, frameMat));               // seat tube
rig.add(rod(seatJoint, headTop, 0.02, frameMat));           // top tube
rig.add(rod(bb, headBot, 0.024, frameMat));                 // down tube
rig.add(rod(headBot, headTop.clone().add(v(-0.008, 0.03)), 0.028, frameMat)); // head tube
for (const z of [-0.06, 0.06]) {
  rig.add(rod(v(rearAxle.x, rearAxle.y, z), v(bb.x, bb.y, z * 0.5), 0.012, frameMat));       // chain stays
  rig.add(rod(v(rearAxle.x, rearAxle.y, z), v(seatJoint.x, seatJoint.y, z * 0.3), 0.012, frameMat)); // seat stays
  rig.add(rod(v(headBot.x, headBot.y, z * 0.4), v(frontAxle.x, frontAxle.y, z), 0.013, chrome));    // fork
}
// seat post + saddle
const seatTop = v(-0.21, 0.95);
rig.add(rod(seatJoint, seatTop, 0.014, chrome));
const saddle = blob(leather); saddle.position.set(-0.22, 0.975, 0); saddle.scale.set(0.13, 0.03, 0.07);
rig.add(saddle);
// stem + handlebar
const stemTop = v(0.44, 1.06);
rig.add(rod(headTop, stemTop, 0.016, chrome));
const GRIP_Z = 0.25, grip = v(0.42, 1.06);
rig.add(rod(v(stemTop.x, stemTop.y, -0.3), v(stemTop.x, stemTop.y, 0.3), 0.013, chrome));
for (const s of [-1, 1]) rig.add(rod(v(grip.x, grip.y, s * 0.2), v(grip.x, grip.y, s * 0.31), 0.02, rubber));
// bell
const bell = ball(v(0.44, 1.09, 0.12), 0.025, M(0xffd23f, { metalness: 0.8, roughness: 0.2 }));
rig.add(bell);
// front basket with a fish snack
const basket = new THREE.Group();
const wicker = M(0xb98a4e, { roughness: 1 });
const bw = 0.22, bd = 0.28, bh = 0.14;
const bottom = sh(new THREE.Mesh(new THREE.BoxGeometry(bw, 0.015, bd), wicker)); basket.add(bottom);
for (const [x, z, w, d] of [[bw / 2, 0, 0.012, bd], [-bw / 2, 0, 0.012, bd], [0, bd / 2, bw, 0.012], [0, -bd / 2, bw, 0.012]]) {
  const side = sh(new THREE.Mesh(new THREE.BoxGeometry(w, bh, d), wicker));
  side.position.set(x, bh / 2, z); basket.add(side);
}
const snack = ball(v(0, bh * 0.9, 0), 1, M(0x9fb4c2, { metalness: 0.5, roughness: 0.3 }));
snack.scale.set(0.05, 0.03, 0.11); snack.rotation.y = 0.3; basket.add(snack);
const snackTail = sh(new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.06, 3), snack.material));
snackTail.position.set(0.03, bh * 0.9 + 0.02, 0.12); snackTail.rotation.x = 0.8; basket.add(snackTail);
basket.position.set(0.66, 0.93, 0);
rig.add(basket);
rig.add(rod(v(0.6, 0.93, 0), v(0.5, 0.95, 0), 0.008, chrome));

// drivetrain
const crank = new THREE.Group(); crank.position.copy(bb); rig.add(crank);
const ring = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.008, 28), chrome));
ring.rotation.x = Math.PI / 2; ring.position.z = 0.07; crank.add(ring);
const CRANK = 0.17;
crank.add(rod(v(0, 0, 0.1), v(CRANK, 0, 0.1), 0.013, chrome));
crank.add(rod(v(0, 0, -0.1), v(-CRANK, 0, -0.1), 0.013, chrome));
crank.add(rod(v(0, 0, -0.1), v(0, 0, 0.1), 0.018, chrome));
const cog = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.01, 18), chrome));
cog.rotation.x = Math.PI / 2; cog.position.set(rearAxle.x, rearAxle.y, 0.07); rig.add(cog);
const chainMat = M(0x444444, { metalness: 0.7, roughness: 0.4 });
rig.add(rod(v(bb.x, bb.y + 0.1, 0.07), v(rearAxle.x, rearAxle.y + 0.05, 0.07), 0.006, chainMat));
rig.add(rod(v(bb.x, bb.y - 0.1, 0.07), v(rearAxle.x, rearAxle.y - 0.05, 0.07), 0.006, chainMat));
const pedalMat = M(0x2b2b2b);
const pedals = [0, 1].map(() => { const p = sh(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.08), pedalMat)); rig.add(p); return p; });

// ---------------------------------------------------------------- pelican
const white = M(0xf6f3ec, { roughness: 0.85 });
const cream = M(0xf3e6b5, { roughness: 0.85 });
const grey = M(0xc4c8cd, { roughness: 0.85 });
const dark = M(0x2a2a2e, { roughness: 0.8 });
const beakMat = M(0xf2a93b, { roughness: 0.45 });
const pouchMat = M(0xf27b45, { roughness: 0.5 });
const legMat = M(0xeb8f3c, { roughness: 0.55 });
const helmetMat = M(0xe63946, { roughness: 0.3, metalness: 0.1 });

const bodyG = new THREE.Group(); rig.add(bodyG);
const body = blob(white);
body.position.set(-0.1, 1.25, 0); body.scale.set(0.43, 0.3, 0.27); body.rotation.z = 0.35;
bodyG.add(body);
const chest = blob(cream);
chest.position.set(0.14, 1.36, 0); chest.scale.set(0.16, 0.17, 0.2); chest.rotation.z = 0.5;
bodyG.add(chest);
const tail = sh(new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.32, 10), white));
tail.rotation.z = Math.PI / 2 + 0.25; tail.scale.z = 0.5; tail.position.set(-0.52, 1.08, 0);
bodyG.add(tail);
const tailTip = sh(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.12, 8), dark));
tailTip.rotation.z = Math.PI / 2 + 0.25; tailTip.scale.z = 0.5; tailTip.position.set(-0.7, 1.04, 0);
bodyG.add(tailTip);

// neck: chain of overlapping spheres along an S-curve
const NECK_N = 36;
const neckBeads = [];
for (let i = 0; i < NECK_N; i++) { const b = blob(white); bodyG.add(b); neckBeads.push(b); }

// head
const head = new THREE.Group(); bodyG.add(head);
const skull = blob(white); skull.scale.set(0.12, 0.1, 0.095); head.add(skull);
const crest = blob(cream); crest.scale.set(0.08, 0.04, 0.06); crest.position.set(-0.06, 0.07, 0); head.add(crest);
for (const s of [-1, 1]) {
  const ringE = ball(v(0.045, 0.025, s * 0.078), 0.024, M(0xf6d6a6)); head.add(ringE);
  const eye = ball(v(0.05, 0.027, s * 0.093), 0.014, M(0x111111, { roughness: 0.2 })); head.add(eye);
  const glint = ball(v(0.057, 0.034, s * 0.103), 0.004, M(0xffffff, { emissive: 0xffffff })); head.add(glint);
}
// cycling helmet
const helmet = sh(new THREE.Mesh(new THREE.SphereGeometry(0.115, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), helmetMat));
helmet.position.set(-0.01, 0.035, 0); helmet.scale.set(1.15, 0.85, 1); helmet.rotation.z = 0.12;
head.add(helmet);
const stripe = sh(new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.008, 6, 24, Math.PI), M(0xffffff)));
stripe.rotation.y = Math.PI / 2; stripe.position.set(-0.01, 0.04, 0); stripe.scale.set(1, 0.85, 1.15);
head.add(stripe);
// beak + pouch
const beak = new THREE.Group(); beak.position.set(0.08, -0.025, 0); beak.rotation.z = -0.32; head.add(beak);
const BEAK_L = 0.62;
const upper = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.042, BEAK_L, 12), beakMat));
upper.rotation.z = -Math.PI / 2; upper.position.set(BEAK_L / 2, 0, 0); upper.scale.set(1, 1, 0.55);
beak.add(upper);
const hook = ball(v(BEAK_L, -0.012, 0), 0.022, M(0xd9452b)); hook.scale.set(0.028, 0.022, 0.018); beak.add(hook);
const lower = rod(v(0.02, -0.035, 0), v(BEAK_L - 0.02, -0.022, 0), 0.012, beakMat); beak.add(lower);
const pouch = blob(pouchMat); beak.add(pouch);
const pouchBase = { x: BEAK_L * 0.45, y: -0.075 };
pouch.position.set(pouchBase.x, pouchBase.y, 0);

// wings (children of rig so they can grip the handlebar)
const wings = [-1, 1].map(s => {
  const w = { s, upper: blob(grey), fore: blob(white), trail: blob(grey), trailTip: blob(dark), hand: [] };
  rig.add(w.upper, w.fore, w.trail, w.trailTip);
  // black primaries wrapped around the grip
  for (let k = 0; k < 3; k++) {
    const f = blob(dark);
    const a = -0.5 + k * 0.45;
    setBlob(f, v(grip.x - 0.03, grip.y + 0.02, s * GRIP_Z),
               v(grip.x + 0.1 * Math.cos(a), grip.y + 0.1 * Math.sin(a) - 0.02, s * (GRIP_Z + 0.02 - k * 0.015)), 0.03, 0.018);
    rig.add(f);
  }
  return w;
});

// legs
const legs = [-1, 1].map(s => {
  const l = { s, thigh: blob(white), shin: sh(new THREE.Mesh(unitCyl, legMat)), knee: blob(legMat), foot: new THREE.Group() };
  const web = sh(new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.17, 3), legMat));
  web.rotation.z = -Math.PI / 2;
  l.foot.add(web); l.foot.scale.set(1, 0.25, 1);
  rig.add(l.thigh, l.shin, l.knee, l.foot);
  return l;
});

const L1 = 0.47, L2 = 0.47;
// two-bone IK in the bike's side plane; knee bends forward (+x)
function solveKnee(hip, ankle) {
  const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
  let d = Math.hypot(dx, dy);
  d = Math.min(d, L1 + L2 - 1e-3);
  const a = Math.atan2(dy, dx);
  const alpha = Math.acos(THREE.MathUtils.clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  return v(hip.x + L1 * Math.cos(a + alpha), hip.y + L1 * Math.sin(a + alpha), (hip.z + ankle.z) / 2 + Math.sign(hip.z) * 0.03);
}

// ---------------------------------------------------------------- animation state
let paused = false, follow = true, speedMul = 1;
let dist = 0, time = 0;
const clock = new THREE.Clock();
const BASE_SPEED = 2.4;            // m/s along the track
const GEAR = 1 / 1.9;              // crank turns per wheel turn

const ui = {
  pause: document.getElementById('pause'),
  cam: document.getElementById('cam'),
  speed: document.getElementById('speed'),
};
ui.pause.onclick = () => { paused = !paused; ui.pause.textContent = paused ? 'Play' : 'Pause'; };
ui.speed.oninput = e => { speedMul = parseFloat(e.target.value); };
ui.cam.onclick = () => {
  follow = !follow;
  ui.cam.textContent = 'Camera: ' + (follow ? 'Follow' : 'Overview');
  if (follow) {
    const p = rig.position;
    camera.position.set(p.x * 1.45, 2.6, p.z * 1.45);
    controls.target.set(p.x, 1, p.z);
  } else {
    camera.position.set(14, 11, 14);
    controls.target.set(0, 0.5, 0);
  }
};

const tmp = new THREE.Vector3();
let neckCurve = new THREE.CatmullRomCurve3([v(0, 0), v(0, 1)]);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) { time += dt; dist += dt * BASE_SPEED * speedMul; }

  // ride around the track (counter-clockwise from above; track centre is on the rider's left)
  const phi = dist / TRACK_R;
  rig.position.set(Math.cos(phi) * TRACK_R, 0, Math.sin(phi) * TRACK_R);
  rig.rotation.y = -(phi + Math.PI / 2);
  const leanTarget = 0.06 + 0.05 * Math.min(speedMul, 2);
  rig.rotation.x += ((speedMul > 0 ? leanTarget : 0) - rig.rotation.x) * 0.05;

  const wheelAngle = -dist / WR;
  rearWheel.rotation.z = wheelAngle;
  frontWheel.rotation.z = wheelAngle;
  const c = wheelAngle * GEAR;
  crank.rotation.z = c;

  // pedals stay level
  const pedalPos = [
    v(bb.x + CRANK * Math.cos(c + Math.PI), bb.y + CRANK * Math.sin(c + Math.PI), -0.16),
    v(bb.x + CRANK * Math.cos(c), bb.y + CRANK * Math.sin(c), 0.16),
  ];
  pedals.forEach((p, i) => p.position.copy(pedalPos[i]));

  // body bob with each pedal stroke
  const bob = 0.012 * Math.sin(2 * c);
  bodyG.position.y = bob;
  bodyG.rotation.x = 0.025 * Math.sin(c);

  // legs
  legs.forEach((l, i) => {
    const hip = v(-0.17, 1.05 + bob, l.s * 0.11);
    const ankle = pedalPos[i].clone().add(v(-0.03, 0.05, 0));
    const knee = solveKnee(hip, ankle);
    setBlob(l.thigh, hip, knee, 0.058, 0.055);
    setRod(l.shin, knee, ankle, 0.022);
    l.knee.position.copy(knee); l.knee.scale.setScalar(0.03);
    l.foot.position.copy(pedalPos[i]).add(v(0.04, 0.03, 0));
  });

  // wings reach forward to the grips
  wings.forEach(w => {
    const shoulder = v(0.06, 1.36 + bob, w.s * 0.21);
    const elbow = v(0.12, 1.16 + bob, w.s * 0.33);
    const wrist = v(grip.x - 0.03, grip.y + 0.02, w.s * GRIP_Z);
    setBlob(w.upper, shoulder, elbow, 0.07, 0.045);
    setBlob(w.fore, elbow, wrist, 0.05, 0.035);
    const trailEnd = v(-0.42, 1.2 + bob, w.s * 0.27);
    setBlob(w.trail, elbow.clone().add(v(0, 0.05, 0)), trailEnd, 0.11, 0.03);
    setBlob(w.trailTip, v(-0.25, 1.19 + bob, w.s * 0.285), v(-0.55, 1.15 + bob, w.s * 0.25), 0.06, 0.022);
  });

  // neck and head
  const sway = Math.sin(time * 0.9) * 0.03;
  const nod = 0.015 * Math.sin(2 * c + 0.6);
  const headPos = v(0.3 + sway * 0.5, 2.0 + nod, sway);
  neckCurve = new THREE.CatmullRomCurve3([
    v(0.18, 1.36), v(0.33, 1.58, sway * 0.3), v(0.18, 1.82, sway * 0.7), headPos.clone().add(v(-0.05, -0.02)),
  ]);
  neckBeads.forEach((b, i) => {
    const u = i / (NECK_N - 1);
    neckCurve.getPoint(u, tmp);
    b.position.copy(tmp);
    b.scale.setScalar(0.085 - 0.032 * u);
  });
  head.position.copy(headPos);
  head.rotation.set(0, Math.sin(time * 0.45) * 0.25, -nod * 3);
  const jig = 1 + 0.12 * Math.sin(time * 7 + c);
  pouch.scale.set(BEAK_L * 0.42, 0.065 * jig, 0.05);
  pouch.position.y = pouchBase.y - 0.01 * (jig - 1);

  // ambient life
  clouds.forEach(cl => {
    cl.userData.a += cl.userData.s * dt;
    cl.position.x = Math.cos(cl.userData.a) * cl.userData.r;
    cl.position.z = Math.sin(cl.userData.a) * cl.userData.r;
  });
  if (!paused) {
    fishState.next -= dt;
    if (!fish.visible && fishState.next <= 0) {
      const a = Math.random() * Math.PI * 2, r = Math.random() * 2;
      Object.assign(fishState, { t: 0, x: Math.cos(a) * r, z: Math.sin(a) * r, dir: Math.random() * Math.PI * 2 });
      fish.visible = true;
    }
    if (fish.visible) {
      fishState.t += dt;
      const T = 0.9, k = fishState.t / T;
      if (k >= 1) { fish.visible = false; fishState.next = 2 + Math.random() * 4; }
      else {
        const along = (k - 0.5) * 0.9;
        fish.position.set(fishState.x + Math.cos(fishState.dir) * along, 0.02 + 0.9 * 4 * k * (1 - k) - 0.05,
                          fishState.z - Math.sin(fishState.dir) * along);
        fish.rotation.set(0, fishState.dir, (0.5 - k) * 2.2);
      }
    }
  }

  // camera follows the rider while still letting the user orbit
  if (follow) {
    const target = tmp.set(rig.position.x, 1.0, rig.position.z);
    camera.position.add(target.clone().sub(controls.target));
    controls.target.copy(target);
  }
  controls.update();
  renderer.render(scene, camera);
}

// initial camera: three-quarter view from the outside of the track
animate();
(() => {
  const p = rig.position;
  controls.target.set(p.x, 1, p.z);
  camera.position.set(p.x + 2.6, 1.9, p.z + 2.6);
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
