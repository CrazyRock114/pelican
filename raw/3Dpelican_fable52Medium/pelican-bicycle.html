<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Riding a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd4f2; }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 14px/1.4 system-ui, -apple-system, sans-serif; color: #17384d;
    background: rgba(255,255,255,.6); padding: 6px 14px; border-radius: 999px;
    pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="hint">Drag to orbit · scroll to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const V = (x, y, z) => new THREE.Vector3(x, y, z || 0);
  const SKY = 0x9fd4f2;

  // ---------- renderer / scene / camera ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 45, 120);

  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xdff3ff, 0x4f7a3f, 0.55));
  const sun = new THREE.DirectionalLight(0xfff2d6, 0.95);
  sun.position.set(6, 14, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
  scene.add(sun);

  // ---------- helpers ----------
  const mat = (color, opts) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.7 }, opts));
  const UP = V(0, 1, 0);

  // Orient a unit-height cylinder mesh so it spans from a to b.
  function span(mesh, a, b) {
    const d = b.clone().sub(a);
    const len = d.length();
    mesh.position.copy(a).addScaledVector(d, 0.5);
    mesh.scale.y = len;
    mesh.quaternion.setFromUnitVectors(UP, d.multiplyScalar(1 / len));
    return mesh;
  }
  function tube(a, b, r, material) {
    return span(new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 12), material), a, b);
  }
  function ball(r, material, sx, sy, sz) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), material);
    m.scale.set(sx || 1, sy || 1, sz || 1);
    return m;
  }

  // ---------- materials ----------
  const M = {
    frame: mat(0xd8343a, { roughness: 0.35, metalness: 0.3 }),
    tire: mat(0x222222, { roughness: 0.9 }),
    metal: mat(0xc9ced4, { roughness: 0.3, metalness: 0.8 }),
    dark: mat(0x2b2b2b),
    seat: mat(0x4a2f1c),
    feather: mat(0xfbfaf5, { roughness: 0.85 }),
    wing: mat(0xe9e6dc, { roughness: 0.85 }),
    wingTip: mat(0x2d2d33, { roughness: 0.85 }),
    beak: mat(0xf2a23a, { roughness: 0.5 }),
    pouch: mat(0xf7c05a, { roughness: 0.55 }),
    leg: mat(0xee8a2e, { roughness: 0.6 }),
    eyeW: mat(0xfff7c2, { roughness: 0.3 }),
    eyeB: mat(0x111111, { roughness: 0.2 })
  };

  // ---------- bicycle ----------
  const bike = new THREE.Group();
  scene.add(bike);

  const R = 1.0;                       // wheel radius
  const REAR = V(-1.5, R), FRONT = V(1.5, R);
  const BB = V(-0.2, 0.85);            // bottom bracket
  const SEAT_CL = V(-0.6, 2.05);       // seat cluster
  const HEAD_T = V(0.95, 2.3), HEAD_B = V(1.08, 1.9);
  const BAR = V(0.88, 2.6);
  const CRANK = 0.42, PEDAL_Z = 0.3;

  function makeWheel(pos) {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.TorusGeometry(R - 0.07, 0.07, 14, 48), M.tire));
    g.add(new THREE.Mesh(new THREE.TorusGeometry(R - 0.15, 0.025, 8, 48), M.metal));
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      const z = i % 2 ? 0.05 : -0.05;
      g.add(tube(V(0, 0, z), V(Math.cos(a) * (R - 0.15), Math.sin(a) * (R - 0.15), 0), 0.008, M.metal));
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.2, 12), M.metal);
    hub.rotation.x = Math.PI / 2;
    g.add(hub);
    g.position.copy(pos);
    bike.add(g);
    return g;
  }
  const wheels = [makeWheel(REAR), makeWheel(FRONT)];

  // frame
  bike.add(tube(BB, V(-0.66, 2.22), 0.045, M.frame));            // seat tube + post
  bike.add(tube(SEAT_CL, HEAD_T, 0.045, M.frame));               // top tube
  bike.add(tube(BB, HEAD_B, 0.05, M.frame));                     // down tube
  bike.add(tube(HEAD_B, V(0.92, 2.42), 0.055, M.frame));         // head tube
  bike.add(tube(V(0.92, 2.42), BAR, 0.035, M.metal));            // stem
  for (const s of [-1, 1]) {
    const z = s * 0.1;
    bike.add(tube(V(BB.x, BB.y, z * 0.6), V(REAR.x, REAR.y, z), 0.028, M.frame));       // chain stay
    bike.add(tube(V(SEAT_CL.x, SEAT_CL.y, z * 0.4), V(REAR.x, REAR.y, z), 0.025, M.frame)); // seat stay
    bike.add(tube(V(HEAD_B.x, HEAD_B.y, z * 0.5), V(FRONT.x, FRONT.y, z), 0.032, M.frame)); // fork
  }
  // handlebar + grips
  bike.add(tube(V(BAR.x, BAR.y, -0.6), V(BAR.x, BAR.y, 0.6), 0.03, M.metal));
  for (const s of [-1, 1]) bike.add(tube(V(BAR.x, BAR.y, s * 0.42), V(BAR.x, BAR.y, s * 0.64), 0.045, M.dark));
  // saddle
  const saddle = ball(0.2, M.seat, 1.9, 0.4, 1.0);
  saddle.position.set(-0.62, 2.26, 0);
  bike.add(saddle);
  // little bell
  const bell = ball(0.07, M.metal, 1, 0.8, 1);
  bell.position.set(BAR.x, BAR.y + 0.06, 0.28);
  bike.add(bell);

  // drivetrain
  const crank = new THREE.Group();
  crank.position.copy(BB);
  bike.add(crank);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.03, 28), M.metal);
  ring.rotation.x = Math.PI / 2;
  ring.position.z = 0.12;
  crank.add(ring);
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 10), M.metal);
  axle.rotation.x = Math.PI / 2;
  crank.add(axle);
  crank.add(tube(V(0, 0, 0.22), V(CRANK, 0, 0.22), 0.03, M.metal));
  crank.add(tube(V(0, 0, -0.22), V(-CRANK, 0, -0.22), 0.03, M.metal));
  const cog = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.03, 18), M.metal);
  cog.rotation.x = Math.PI / 2;
  cog.position.set(REAR.x, REAR.y, 0.12);
  bike.add(cog);
  bike.add(tube(V(BB.x, BB.y + 0.22, 0.12), V(REAR.x, REAR.y + 0.1, 0.12), 0.012, M.dark));
  bike.add(tube(V(BB.x, BB.y - 0.22, 0.12), V(REAR.x, REAR.y - 0.1, 0.12), 0.012, M.dark));

  // pedals, legs and feet (animated)
  const HIP = [V(-0.42, 2.55, PEDAL_Z * 0.9), V(-0.42, 2.55, -PEDAL_Z * 0.9)];
  const L1 = 1.1, L2 = 1.1;
  const limbs = [0, 1].map(() => {
    const o = {
      pedal: new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.22), M.dark),
      thigh: new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 1, 10), M.leg),
      shin: new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 1, 10), M.leg),
      knee: ball(0.065, M.leg),
      foot: new THREE.Group()
    };
    // webbed foot: three toes + web
    const fan = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.42, 3), M.leg);
    fan.rotation.z = Math.PI / 2;      // tip toward -x (heel)
    const fanWrap = new THREE.Group();
    fanWrap.add(fan);
    fanWrap.scale.y = 0.16;
    fanWrap.position.set(0.1, 0.02, 0);
    o.foot.add(fanWrap);
    bike.add(o.pedal, o.thigh, o.shin, o.knee, o.foot);
    return o;
  });

  // ---------- pelican ----------
  const pelican = new THREE.Group();
  bike.add(pelican);

  const body = ball(1, M.feather, 1.05, 0.72, 0.64);
  body.position.set(-0.5, 2.98, 0);
  body.rotation.z = 0.28;
  pelican.add(body);

  const chest = ball(0.5, M.feather, 1, 1, 0.95);
  chest.position.set(0.1, 3.05, 0);
  pelican.add(chest);

  // tail feathers
  for (const dz of [-0.14, 0, 0.14]) {
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.7, 8), dz === 0 ? M.wing : M.wingTip);
    t.scale.z = 0.4;
    t.position.set(-1.62, 2.82 + (dz === 0 ? 0.03 : 0), dz);
    t.rotation.z = Math.PI / 2 + 0.25;
    t.rotation.y = dz * 1.2;
    pelican.add(t);
  }

  // folded wings on the flanks + forewings reaching to the handlebar
  const forewings = [];
  for (const s of [-1, 1]) {
    const w = ball(1, M.wing, 0.85, 0.42, 0.1);
    w.position.set(-0.65, 3.05, s * 0.6);
    w.rotation.z = 0.2;
    w.rotation.y = -s * 0.1;
    pelican.add(w);
    const tip = ball(1, M.wingTip, 0.5, 0.2, 0.08);
    tip.position.set(-1.2, 2.82, s * 0.6);
    tip.rotation.z = 0.3;
    pelican.add(tip);

    const fw = new THREE.Group();
    const a = V(-0.05, 3.2, s * 0.5), b = V(BAR.x, BAR.y + 0.03, s * 0.52);
    const arm = ball(1, M.wing, 0.13, 0.5, 0.2);   // unit along y, spans via scale
    const d = b.clone().sub(a), len = d.length();
    arm.scale.y = len / 2 + 0.05;
    arm.position.copy(a).addScaledVector(d, 0.5);
    arm.quaternion.setFromUnitVectors(UP, d.clone().normalize());
    fw.add(arm);
    // feather "fingers" wrapped over the grip
    for (let i = -1; i <= 1; i++) {
      const f = ball(1, M.wingTip, 0.17, 0.05, 0.05);
      f.position.set(b.x + 0.06, b.y + 0.03, b.z + i * 0.08);
      f.rotation.z = -0.5;
      fw.add(f);
    }
    pelican.add(fw);
    forewings.push(fw);
  }

  // neck (S-curve)
  const HEAD = V(0.5, 4.42);
  const neckCurve = new THREE.CatmullRomCurve3([
    V(0.1, 3.15), V(0.5, 3.5), V(0.42, 3.85), V(0.22, 4.12), V(0.3, 4.36), HEAD
  ]);
  pelican.add(new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 40, 0.15, 14), M.feather));

  // head + beak
  const head = new THREE.Group();
  head.position.copy(HEAD);
  pelican.add(head);
  head.add(ball(0.26, M.feather, 1.15, 1, 0.95));
  const crest = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.4, 8), M.feather);
  crest.position.set(-0.3, 0.1, 0);
  crest.rotation.z = Math.PI / 2 - 0.4;
  head.add(crest);

  const BEAK_LEN = 1.5;
  const upper = new THREE.Mesh(new THREE.ConeGeometry(0.13, BEAK_LEN, 14), M.beak);
  upper.rotation.z = -Math.PI / 2;                 // tip toward +x
  upper.scale.x = 0.8;                           // flatten vertically (pre-rotation x → world y)
  upper.position.set(0.15 + BEAK_LEN / 2, 0.0, 0);
  head.add(upper);
  const hook = ball(0.05, M.leg, 1, 1.3, 0.8);
  hook.position.set(0.15 + BEAK_LEN - 0.02, -0.04, 0);
  head.add(hook);
  const pouch = ball(1, M.pouch, 0.58, 0.24, 0.09);
  pouch.position.set(0.74, -0.2, 0);
  pouch.rotation.z = 0.12;
  head.add(pouch);
  const lower = new THREE.Mesh(new THREE.ConeGeometry(0.1, BEAK_LEN - 0.1, 12), M.beak);
  lower.rotation.z = -Math.PI / 2;
  lower.scale.x = 0.3;
  lower.position.set(0.15 + (BEAK_LEN - 0.1) / 2, -0.07, 0);
  head.add(lower);

  for (const s of [-1, 1]) {
    const e = ball(0.065, M.eyeW);
    e.position.set(0.12, 0.08, s * 0.215);
    head.add(e);
    const p = ball(0.035, M.eyeB);
    p.position.set(0.14, 0.08, s * 0.265);
    head.add(p);
  }
  head.rotation.z = -0.3;

  bike.traverse(o => { if (o.isMesh) { o.castShadow = true; } });

  // ---------- world ----------
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), mat(0x5fa84a, { roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const road = new THREE.Mesh(new THREE.PlaneGeometry(300, 5), mat(0x55585e, { roughness: 0.95 }));
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  road.receiveShadow = true;
  scene.add(road);
  for (const z of [-2.35, 2.35]) {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(300, 0.12), mat(0xf3f1e6));
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(0, 0.02, z);
    scene.add(edge);
  }

  const SPAN = 90;                         // scrolling objects wrap within ±SPAN/2
  const scrollers = [];
  for (let i = 0; i < SPAN / 4; i++) {
    const dash = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.14), mat(0xf7d64a));
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(-SPAN / 2 + i * 4, 0.02, -1.2);
    scene.add(dash);
    scrollers.push({ obj: dash, k: 1 });
  }

  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const trunkM = mat(0x6e4a2c), leafM = [mat(0x3f8f4a), mat(0x2f7a45), mat(0x57a352)];
  for (let i = 0; i < 46; i++) {
    const t = new THREE.Group();
    const h = 1.6 + rnd() * 1.6;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.17, h, 8), trunkM);
    trunk.position.y = h / 2;
    t.add(trunk);
    const lm = leafM[i % 3];
    if (i % 3 === 0) {
      const crown = ball(0.9 + rnd() * 0.5, lm, 1, 1.1, 1);
      crown.position.y = h + 0.6;
      t.add(crown);
    } else {
      for (let k = 0; k < 3; k++) {
        const c = new THREE.Mesh(new THREE.ConeGeometry(1.1 - k * 0.27, 1.5, 10), lm);
        c.position.y = h + 0.3 + k * 0.85;
        t.add(c);
      }
    }
    const side = i % 2 ? 1 : -1;
    t.position.set(-SPAN / 2 + rnd() * SPAN, 0, side * (5 + rnd() * 22));
    t.traverse(o => { if (o.isMesh) o.castShadow = true; });
    scene.add(t);
    scrollers.push({ obj: t, k: 1 });
  }

  // flowers / pebbles near the road for a sense of speed
  const dotM = [mat(0xffffff), mat(0xffd84d), mat(0xff8fa8), mat(0x9a9a92)];
  for (let i = 0; i < 90; i++) {
    const d = ball(0.07 + rnd() * 0.06, dotM[i % 4]);
    const side = i % 2 ? 1 : -1;
    d.position.set(-SPAN / 2 + rnd() * SPAN, 0.06, side * (2.9 + rnd() * 5));
    scene.add(d);
    scrollers.push({ obj: d, k: 1 });
  }

  // distant hills (slow parallax)
  const hillM = [mat(0x7ab873, { roughness: 1 }), mat(0x6aa96b, { roughness: 1 })];
  for (let i = 0; i < 12; i++) {
    const r = 9 + rnd() * 9;
    const hill = ball(r, hillM[i % 2], 1.6, 0.5, 1);
    hill.position.set(-SPAN / 2 + (i / 12) * SPAN, -1, (i % 2 ? 1 : -1) * (42 + rnd() * 10));
    scene.add(hill);
    scrollers.push({ obj: hill, k: 0.25 });
  }

  // clouds
  const cloudM = mat(0xffffff, { roughness: 1, fog: false });
  for (let i = 0; i < 12; i++) {
    const c = new THREE.Group();
    const n = 4 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) {
      const puff = ball(1.2 + rnd() * 1.2, cloudM, 1, 0.7, 1);
      puff.position.set(k * 1.5 - n * 0.75, rnd() * 0.6, rnd() * 1.2);
      c.add(puff);
    }
    c.position.set(-SPAN / 2 + rnd() * SPAN, 14 + rnd() * 8, -45 + rnd() * 90);
    if (Math.abs(c.position.z) < 12) c.position.z += 24 * Math.sign(c.position.z || 1);
    scene.add(c);
    scrollers.push({ obj: c, k: 0.12 });
  }

  // ---------- camera controls ----------
  const target = V(0, 2.3, 0);
  let theta = 0.75, phi = 1.25, radius = 11, dragging = false, lastX = 0, lastY = 0, idle = 0;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    theta -= (e.clientX - lastX) * 0.006;
    phi = Math.min(1.5, Math.max(0.35, phi - (e.clientY - lastY) * 0.005));
    lastX = e.clientX; lastY = e.clientY;
  });
  const stop = () => { dragging = false; idle = 0; };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
  el.addEventListener('wheel', e => {
    e.preventDefault();
    radius = Math.min(30, Math.max(5, radius * (1 + e.deltaY * 0.001)));
  }, { passive: false });
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animation ----------
  const WHEEL_W = 5.5;                 // rad/s
  const CRANK_W = WHEEL_W / 2.2;
  const SPEED = WHEEL_W * R;
  const clock = new THREE.Clock();
  const tmpF = V(0, 0), tmpK = V(0, 0);

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    for (const w of wheels) w.rotation.z = -t * WHEEL_W;
    const th = -t * CRANK_W;
    crank.rotation.z = th;

    limbs.forEach((L, i) => {
      const a = th + (i ? Math.PI : 0);
      const z = i ? -PEDAL_Z : PEDAL_Z;
      const px = BB.x + Math.cos(a) * CRANK, py = BB.y + Math.sin(a) * CRANK;
      L.pedal.position.set(px, py, z);
      tmpF.set(px - 0.02, py + 0.08, z);
      L.foot.position.copy(tmpF);
      L.foot.rotation.z = -0.12 + Math.sin(a) * 0.15;
      // two-bone IK in the xy plane, knee forward
      const H = HIP[i];
      const dx = tmpF.x - H.x, dy = tmpF.y - H.y;
      const d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.001);
      const base = Math.atan2(dy, dx);
      const k = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
      tmpK.set(H.x + Math.cos(base + k) * L1, H.y + Math.sin(base + k) * L1, (H.z + z) / 2 + (i ? -0.06 : 0.06));
      span(L.thigh, H, tmpK);
      span(L.shin, tmpK, tmpF);
      L.knee.position.copy(tmpK);
    });

    // rider life: bob, head nod, pouch wobble, slight bike sway
    const beat = t * CRANK_W * 2;
    pelican.position.y = Math.sin(beat) * 0.018;
    head.rotation.z = -0.3 + Math.sin(beat + 0.6) * 0.045;
    head.rotation.y = Math.sin(t * 0.7) * 0.18;
    pouch.scale.y = 0.24 + Math.sin(t * 3.1) * 0.025;
    bike.rotation.x = Math.sin(t * CRANK_W) * 0.035;
    bike.position.z = Math.sin(t * 0.5) * 0.25;

    for (const s of scrollers) {
      s.obj.position.x -= SPEED * s.k * dt;
      if (s.obj.position.x < -SPAN / 2) s.obj.position.x += SPAN;
    }

    if (!dragging) { idle += dt; if (idle > 1.5) theta += dt * 0.12; }
    const sp = Math.sin(phi);
    camera.position.set(
      target.x + radius * sp * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * sp * Math.cos(theta)
    );
    camera.lookAt(target);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
