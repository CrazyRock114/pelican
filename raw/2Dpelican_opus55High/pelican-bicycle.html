<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  :root {
    --bg: #eef3f8;
    --card: #ffffff;
    --ink: #1f2a37;
    --muted: #5b6878;
    --accent: #e53946;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121821; --card: #1b2430; --ink: #e8eef5; --muted: #9aa8b8; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 650; letter-spacing: -0.01em; }
  .stage {
    width: 100%;
    max-width: 960px;
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  svg { display: block; width: 100%; height: auto; cursor: pointer; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px 20px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  button {
    font: inherit;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  label { display: flex; align-items: center; gap: 8px; }
  input[type=range] { accent-color: var(--accent); width: 160px; }
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // Bike geometry (matches the static SVG)
  const R = 68;                       // wheel radius
  const REAR = [250, 387], FRONT = [500, 387];
  const BB = [365, 392];              // bottom bracket
  const CRANK = 22;                   // crank arm length
  const GEAR = 1.6;                   // wheel turns per crank turn
  const HIP = [335, 286];
  const THIGH = 64, SHIN = 70;

  const els = {
    rearSpokes: $('rearSpokes'), frontSpokes: $('frontSpokes'),
    chainring: $('chainring'), chain: $('chain'),
    nearThigh: $('nearThigh'), nearShin: $('nearShin'), nearFoot: $('nearFoot'),
    farThigh: $('farThigh'), farShin: $('farShin'), farFoot: $('farFoot'),
    nearCrank: $('nearCrank'), farCrank: $('farCrank'),
    nearPedal: $('nearPedal'), farPedal: $('farPedal'),
    pelican: $('pelican'), head: $('head'), eye: $('eye'),
    scarf1: $('scarf1'), scarf2: $('scarf2'),
    hillsFar: $('hillsFar'), hillsNear: $('hillsNear'),
    grass: $('grassTile'), road: $('roadTile'),
    speedLines: $('speedLines').querySelectorAll('line'),
    dust: $('dust'),
  };
  const clouds = [...document.querySelectorAll('.cloud')].map(g => ({
    g, x: +g.dataset.x, y: +g.dataset.y, s: +g.dataset.s
  }));

  // Dust puffs kicked up behind the rear wheel
  const SVGNS = 'http://www.w3.org/2000/svg';
  const puffs = Array.from({ length: 6 }, (_, i) => {
    const c = document.createElementNS(SVGNS, 'circle');
    els.dust.appendChild(c);
    return { c, offset: i / 6 };
  });

  let dist = 0, time = 0, last = null;
  let speed = 220, paused = false;
  let nextBlink = 2.5, blinkStart = -1;

  const f1 = n => n.toFixed(1);

  // Two-bone inverse kinematics; returns the knee that points forward (+x)
  function solveLeg(hx, hy, fx, fy) {
    const dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(THIGH - SHIN) + 0.5, Math.min(d, THIGH + SHIN - 0.5));
    const a = Math.atan2(dy, dx);
    const cosB = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const b = Math.acos(Math.max(-1, Math.min(1, cosB)));
    const k1 = [hx + THIGH * Math.cos(a - b), hy + THIGH * Math.sin(a - b)];
    const k2 = [hx + THIGH * Math.cos(a + b), hy + THIGH * Math.sin(a + b)];
    const knee = k1[0] > k2[0] ? k1 : k2;
    // ankle: as close to the target as the shin allows
    const ka = Math.atan2(fy - knee[1], fx - knee[0]);
    const ankle = [knee[0] + SHIN * Math.cos(ka), knee[1] + SHIN * Math.sin(ka)];
    return { knee, ankle };
  }

  function drawLeg(theta, hip, thigh, shin, foot, crank, pedal) {
    const px = BB[0] + CRANK * Math.cos(theta);
    const py = BB[1] + CRANK * Math.sin(theta);
    crank.setAttribute('x1', BB[0]); crank.setAttribute('y1', BB[1]);
    crank.setAttribute('x2', f1(px)); crank.setAttribute('y2', f1(py));
    pedal.setAttribute('x', f1(px - 9)); pedal.setAttribute('y', f1(py - 2));

    const target = [px - 7, py - 6];
    const { knee, ankle } = solveLeg(hip[0], hip[1], target[0], target[1]);
    thigh.setAttribute('d', `M${f1(hip[0])} ${f1(hip[1])} L${f1(knee[0])} ${f1(knee[1])}`);
    shin.setAttribute('d', `M${f1(knee[0])} ${f1(knee[1])} L${f1(ankle[0])} ${f1(ankle[1])}`);
    const tilt = -8 * Math.sin(theta);   // toes dip a little through the stroke
    foot.setAttribute('transform', `translate(${f1(ankle[0])} ${f1(ankle[1])}) rotate(${f1(tilt)})`);
  }

  // A fluttering ribbon built from a wavy centre line
  function ribbon(x0, y0, len, phase, w0, wave) {
    const N = 14, top = [], bot = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const x = x0 - u * len;
      const y = y0 + u * 8 + Math.sin(wave + phase - u * 5) * u * 8;
      const w = w0 * (1 - u * 0.45);
      top.push(`${f1(x)} ${f1(y - w)}`);
      bot.unshift(`${f1(x)} ${f1(y + w)}`);
    }
    return `M${top.join(' L')} L${bot.join(' L')} Z`;
  }

  const tile = (el, factor) =>
    el.setAttribute('transform', `translate(${f1(-((dist * factor) % 800))} 0)`);

  function render() {
    // Parallax scenery
    tile(els.hillsFar, 0.12);
    tile(els.hillsNear, 0.35);
    tile(els.grass, 0.8);
    tile(els.road, 1);
    for (const c of clouds) {
      const span = 1150;
      const x = ((c.x - dist * 0.05 * c.s) % span + span) % span - 150;
      c.g.setAttribute('transform', `translate(${f1(x)} ${c.y}) scale(${c.s})`);
    }

    // Wheels and drivetrain
    const wheelRad = dist / R;
    const wheelDeg = wheelRad * 180 / Math.PI;
    els.rearSpokes.setAttribute('transform', `rotate(${f1(wheelDeg % 360)} ${REAR[0]} ${REAR[1]})`);
    els.frontSpokes.setAttribute('transform', `rotate(${f1(wheelDeg % 360)} ${FRONT[0]} ${FRONT[1]})`);
    const theta = wheelRad / GEAR;
    els.chainring.setAttribute('transform', `rotate(${f1((theta * 180 / Math.PI) % 360)} ${BB[0]} ${BB[1]})`);
    els.chain.setAttribute('stroke-dashoffset', f1(-(theta * 16) % 50));

    // Rider bobs with each pedal stroke
    const bob = Math.sin(theta * 2) * 1.6;
    const lean = Math.sin(theta) * 0.8;
    els.pelican.setAttribute('transform', `translate(${f1(lean)} ${f1(bob)})`);
    const hip = [HIP[0] + lean, HIP[1] + bob];

    drawLeg(theta + Math.PI, hip, els.farThigh, els.farShin, els.farFoot, els.farCrank, els.farPedal);
    drawLeg(theta, hip, els.nearThigh, els.nearShin, els.nearFoot, els.nearCrank, els.nearPedal);

    // Head bob and a cheerful nod
    const nod = Math.sin(theta * 2 + 0.6) * 2.2;
    els.head.setAttribute('transform', `rotate(${f1(nod)} 412 156)`);

    // Blink every few seconds
    let eyeScale = 1;
    if (blinkStart >= 0) {
      const p = (time - blinkStart) / 0.16;
      if (p >= 1) { blinkStart = -1; nextBlink = time + 2 + Math.random() * 3; }
      else eyeScale = Math.max(0.1, Math.abs(1 - 2 * p));
    } else if (time >= nextBlink) {
      blinkStart = time;
    }
    els.eye.setAttribute('transform', `translate(428 138) scale(1 ${f1(eyeScale)}) translate(-428 -138)`);

    // Scarf streams back further the faster we go
    const wave = dist * 0.05;
    const len = 50 + Math.min(speed, 520) * 0.09;
    els.scarf1.setAttribute('d', ribbon(378, 216, len, 0, 6, wave));
    els.scarf2.setAttribute('d', ribbon(376, 222, len * 0.82, 1.7, 5, wave));

    // Speed lines
    els.speedLines.forEach((l, i) => l.setAttribute('stroke-dashoffset', f1(-(dist * (1.1 + i * 0.25)) % 400)));
    const lineAlpha = Math.max(0, Math.min(0.85, (speed - 80) / 300));
    els.speedLines[0].parentNode.setAttribute('opacity', paused ? 0 : f1(lineAlpha));

    // Dust puffs
    for (const p of puffs) {
      const ph = ((dist / 260 + p.offset) % 1 + 1) % 1;
      p.c.setAttribute('cx', f1(180 - ph * 110));
      p.c.setAttribute('cy', f1(451 - ph * 18 - Math.sin(ph * 6 + p.offset * 9) * 3));
      p.c.setAttribute('r', f1(3 + ph * 9));
      p.c.setAttribute('opacity', paused ? 0 : f1(0.55 * (1 - ph) * Math.min(1, speed / 200)));
    }
  }

  function frame(ts) {
    if (last === null) last = ts;
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (!paused) { dist += speed * dt; time += dt; }
    render();
    requestAnimationFrame(frame);
  }

  // Controls
  const btn = $('toggle');
  const setPaused = v => { paused = v; btn.textContent = paused ? 'Ride' : 'Pause'; };
  btn.addEventListener('click', () => setPaused(!paused));
  $('scene').addEventListener('click', () => setPaused(!paused));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPaused(!paused); }
  });
  $('speed').addEventListener('input', e => { speed = +e.target.value; });
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) setPaused(true);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
